name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test agent loop and local transport
        run: swift test
      - name: Test planner schema
        run: python3 -m unittest discover -s PlannerRuntime -p 'test_*.py'
      - name: Build app bundle
        run: bash scripts/build-app.sh --shell-only
      - name: Verify bundle
        run: |
          plutil -lint dist/Brian.app/Contents/Info.plist
          codesign --verify --strict dist/Brian.app
