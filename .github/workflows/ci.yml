name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test command interpretation
        run: swift test
      - name: Build app bundle
        run: bash scripts/build-app.sh
      - name: Verify bundle
        run: |
          plutil -lint dist/Brian.app/Contents/Info.plist
          codesign --verify --strict dist/Brian.app
